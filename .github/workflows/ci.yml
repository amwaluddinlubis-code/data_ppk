name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} · Composer & PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      CI_ENVIRONMENT: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Run PHPUnit test suite
        run: composer test -- --colors=never --no-coverage

  tailwind:
    name: Tailwind CSS build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/tailwind/package-lock.json

      - name: Install frontend dependencies
        working-directory: tools/tailwind
        run: npm ci

      - name: Build Tailwind CSS
        working-directory: tools/tailwind
        run: npx tailwindcss -c tailwind.config.js -i input.css -o /tmp/data-ppk-app.css --minify

      - name: Verify generated CSS
        run: test -s /tmp/data-ppk-app.css
